# nginx site config for backend.transends.space
#
# Serves /downloads/<file> straight from ./videos/ and reverse-proxies
# everything else to the Express app on 127.0.0.1:8000.
#
# Install:
#   sudo cp nginx.conf /etc/nginx/sites-available/backend.transends.space
#   sudo ln -s /etc/nginx/sites-available/backend.transends.space /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d backend.transends.space
#
# Requires nginx to read ./videos (www-data added to the ubuntu group).
#
upstream easyfetch_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    server_name backend.transends.space;

    root /var/www/backend.transends.space;
    index index.html;

    access_log /var/log/nginx/backend.transends.space.access.log;
    error_log  /var/log/nginx/backend.transends.space.error.log;

    # Downloaded videos, served straight from disk by nginx.
    # /downloads/file.mp4 -> /home/ubuntu/EasyFetch-Backend/videos/file.mp4
    location /downloads/ {
        alias /home/ubuntu/EasyFetch-Backend/videos/;
        autoindex off;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=3600";
        access_log /var/log/nginx/backend.transends.space.downloads.log;
    }

    # Everything else goes to the Express app.
    location / {
        proxy_pass http://easyfetch_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/backend.transends.space/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/backend.transends.space/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = backend.transends.space) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name backend.transends.space;
    return 404; # managed by Certbot


}
